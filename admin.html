      
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Administrativo | Mega Variedades</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f1f5fb;color:#172b49;padding:20px}
.container{max-width:850px;margin:auto}
header{background:linear-gradient(120deg,#164b91,#287bd0);color:white;padding:25px;border-radius:16px;margin-bottom:22px}
h1{font-size:25px}
header p{margin-top:7px}
.card{background:white;padding:22px;border-radius:15px;margin-bottom:18px;box-shadow:0 3px 15px #0000000d}
h2{font-size:19px;margin-bottom:17px}
input,textarea,select{width:100%;padding:13px;margin:7px 0 14px;border:1px solid #ccd7e5;border-radius:9px;font-size:15px}
button{border:0;border-radius:9px;padding:13px 17px;background:#1765b4;color:white;font-weight:bold;font-size:15px;cursor:pointer}
button.sec{background:#64748b}
button.danger{background:#c0392b}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.produto{border:1px solid #e0e7ef;border-radius:12px;padding:13px;margin:12px 0;display:flex;gap:13px;align-items:center}
.produto img{width:75px;height:75px;object-fit:cover;border-radius:9px;background:#eee}
.produto-info{flex:1;min-width:0}
.produto-info p{font-size:13px;color:#64748b;margin-top:5px}
#painel{display:none}
#mensagem{margin:12px 0;font-size:14px}
small{color:#64748b}
</style>
</head>
<body>
<div class="container">

<header>
<h1>MEGA VARIEDADES</h1>
<p>Painel administrativo da loja</p>
</header>

<section class="card" id="login">
<h2>Entrar no painel</h2>
<label>E-mail</label>
<input type="email" id="email" placeholder="Seu e-mail">
<label>Senha</label>
<input type="password" id="senha" placeholder="Sua senha">
<button onclick="entrar()">Entrar</button>
<p id="msgLogin"></p>
</section>

<section id="painel">
<div class="card">
<div class="actions" style="justify-content:space-between">
<h2>Gerenciar produtos</h2>
<button class="sec" onclick="sair()">Sair</button>
</div>
</div>

<div class="card">
<h2 id="tituloFormulario">Cadastrar produto</h2>
<input type="hidden" id="produtoId">


<label>Nome do produto</label>
<input id="nome" placeholder="Ex.: Vestido feminino">

<label>Descrição</label>
<textarea id="descricao" placeholder="Descreva o produto"></textarea>

<label>Preço à vista (R$)</label>
<input id="preco" type="number" step="0.01" min="0" placeholder="0,00">

<label>Preço a prazo (R$)</label>
<input id="preco_prazo" type="number" step="0.01" min="0" placeholder="0,00">

<label>Prazo para pagamento</label>
<input id="prazo_dias" type="number" value="30" min="1">

<label>Categoria</label>
<input id="categoria" placeholder="Ex.: Vestidos, Cuecas, Acessórios">

<label>Cores disponíveis</label>
<input id="cores" placeholder="Ex.: Preto, Branco, Azul, Rosa">

<label>Tamanhos disponíveis</label>
<input id="tamanhos" placeholder="Ex.: P, M, G, GG ou Único">

<label>Numeração disponível</label>
<input id="numeracao" placeholder="Ex.: 34, 36, 38, 40">

<label>Estoque</label>
<input id="estoque" type="number" min="0" placeholder="Quantidade">

<label>Foto do produto</label>
<input id="foto" type="file" accept="image/jpeg,image/png,image/webp">
<small>Imagem de até 5 MB.</small>

<p style="margin:12px 0">
<label>
<input type="checkbox" id="ativo" checked style="width:auto">
Produto ativo na loja
</label>
</p>

<div class="actions">
<button onclick="salvarProduto()">Salvar produto</button>
<button class="sec" onclick="limparFormulario()">Limpar</button>
</div>
<p id="msgProduto"></p>
</div>

<div class="card">
<h2>Produtos cadastrados</h2>
<div id="lista">Carregando...</div>
</div>
</section>
</div>

<script>
const SUPABASE_URL = "https://apkkjyvxckdmdhkqoiqf.supabase.co";
const SUPABASE_KEY = "sb_publishable_HB0hPO_bDmQ3_V4hVrQIPQ_rxbQxp79";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function entrar(){
 const email=document.getElementById("email").value.trim();
 const senha=document.getElementById("senha").value;
 const msg=document.getElementById("msgLogin");
 msg.textContent="Verificando...";
 const {error}=await db.auth.signInWithPassword({email,password:senha});
 if(error){msg.textContent="Não foi possível entrar: "+error.message;return;}
 mostrarPainel();
}

async function mostrarPainel(){
 const {data:{session}}=await db.auth.getSession();
 if(!session)return;
 document.getElementById("login").style.display="none";
 document.getElementById("painel").style.display="block";
 carregarProdutos();
}

async function sair(){
 await db.auth.signOut();
 location.reload();
}

function limparFormulario(){
 document.getElementById("produtoId").value="";
 document.getElementById("nome").value="";
 document.getElementById("descricao").value="";
 document.getElementById("preco").value="";
 document.getElementById("categoria").value="";
 document.getElementById("estoque").value="";
 document.getElementById("foto").value="";
 document.getElementById("ativo").checked=true;
 document.getElementById("tituloFormulario").textContent="Cadastrar produto";
 document.getElementById("msgProduto").textContent="";
}

async function salvarProduto(){
 const msg=document.getElementById("msgProduto");
 const {data:{user}}=await db.auth.getUser();
 if(!user){msg.textContent="Faça login novamente.";return;}

 const id=document.getElementById("produtoId").value;
 const nome=document.getElementById("nome").value.trim();
 const preco=Number(document.getElementById("preco").value);
 const categoria=document.getElementById("categoria").value.trim();
 const estoque=Number(document.getElementById("estoque").value);

 if(!nome||!categoria||document.getElementById("preco").value===""||document.getElementById("estoque").value===""){
 msg.textContent="Preencha nome, preço, categoria e estoque.";return;
 }
 if(preco<0||estoque<0){msg.textContent="Preço e estoque não podem ser negativos.";return;}

 msg.textContent="Salvando...";
 let foto_url=null;

 const arquivo=document.getElementById("foto").files[0];

 if(arquivo){
  if(arquivo.size>5*1024*1024){msg.textContent="A imagem deve ter no máximo 5 MB.";return;}
  const extensao=arquivo.name.split(".").pop().toLowerCase();
  const caminho=Date.now()+"-"+Math.random().toString(36).slice(2)+"."+extensao;
  const {error:uploadError}=await db.storage.from("produtos").upload(caminho,arquivo,{upsert:false});
  if(uploadError){msg.textContent="Erro ao enviar foto: "+uploadError.message;return;}
  foto_url=db.storage.from("produtos").getPublicUrl(caminho).data.publicUrl;
 }

 const produto={
  nome,
  descricao:document.getElementById("descricao").value.trim(),
  preco,
  categoria,
  estoque,
  ativo:document.getElementById("ativo").checked
 };
 if(foto_url)produto.foto_url=foto_url;

 let resultado;
 if(id){
  resultado=await db.from("produtos").update(produto).eq("id",id);
 }else{
  resultado=await db.from("produtos").insert(produto);
 }

 if(resultado.error){msg.textContent="Erro ao salvar: "+resultado.error.message;return;}
 msg.textContent="Produto salvo com sucesso!";
 limparFormulario();
 carregarProdutos();
}

async function carregarProdutos(){
 const lista=document.getElementById("lista");
 lista.textContent="Carregando...";
 const {data,error}=await db.from("produtos").select("*").order("criado_em",{ascending:false});
 if(error){lista.textContent="Erro ao carregar: "+error.message;return;}
 if(!data.length){lista.textContent="Nenhum produto cadastrado.";return;}

 lista.innerHTML="";
 data.forEach(p=>{
  const item=document.createElement("div");
  item.className="produto";

  const img=document.createElement("img");
  img.src=p.foto_url||"";
  img.alt=p.nome;
  item.appendChild(img);

  const info=document.createElement("div");
  info.className="produto-info";
  const nome=document.createElement("strong");
  nome.textContent=p.nome;
  const detalhe=document.createElement("p");
  detalhe.textContent="R$ "+Number(p.preco).toFixed(2).replace(".",",")+" | Estoque: "+p.estoque+" | "+p.categoria+" | "+(p.ativo?"Ativo":"Inativo");
  info.append(nome,detalhe);
  item.appendChild(info);

  const botoes=document.createElement("div");
  botoes.className="actions";
  const editar=document.createElement("button");
  editar.textContent="Editar";
  editar.onclick=()=>editarProduto(p);
  const excluir=document.createElement("button");
  excluir.textContent="Excluir";
  excluir.className="danger";
  excluir.onclick=()=>excluirProduto(p.id);
  botoes.append(editar,excluir);
  item.appendChild(botoes);
  lista.appendChild(item);
 });
}

function editarProduto(p){
 document.getElementById("produtoId").value=p.id;
 document.getElementById("nome").value=p.nome;
 document.getElementById("descricao").value=p.descricao||"";
 document.getElementById("preco").value=p.preco;
 document.getElementById("categoria").value=p.categoria;
 document.getElementById("estoque").value=p.estoque;
 document.getElementById("ativo").checked=p.ativo;
 document.getElementById("foto").value="";
 document.getElementById("tituloFormulario").textContent="Editar produto";
 document.getElementById("msgProduto").textContent="Se escolher uma nova foto, ela substituirá a foto exibida.";
 window.scrollTo({top:0,behavior:"smooth"});
}

async function excluirProduto(id){
 if(!confirm("Deseja realmente excluir este produto?"))return;
 const {error}=await db.from("produtos").delete().eq("id",id);
 if(error){alert("Erro ao excluir: "+error.message);return;}
 carregarProdutos();
}

db.auth.onAuthStateChange((event,session)=>{
 if(session)mostrarPainel();
});

mostrarPainel();
</script>
</body>
</html>
